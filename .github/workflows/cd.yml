name: CD

# Deploys `main` — the only branch this repo treats as deployable.
#
# What this does today: gate on the full test suite, then build every
# service's Docker image and publish it to GitHub Container Registry (GHCR),
# tagged with both the commit SHA and `latest`.
#
# Deploy target: a Linux EC2 instance. The `deploy` job SSHes in, pulls the
# repo, builds each service image on the instance (the compose file uses
# `build:`, not `image:`), and recreates the containers. The GHCR images from
# `build-and-push` are not what runs on the instance; that job acts as a gate
# proving every Dockerfile builds before anything is deployed.
#
# One-time setup on the EC2 instance, before this job can run for real:
#   - Docker Engine, Compose v2.24+ and buildx 0.17+ installed (the versions
#     bundled with Amazon Linux 2023 are too old; see ~/.docker/cli-plugins).
#   - This repo checked out at DEPLOY_APP_DIR, on `main`.
#   - A real `.env` at DEPLOY_APP_DIR/.env (gitignored; created by hand).
#   - Swap configured; a 1 GB instance cannot run the whole stack.
#   - Security group allows inbound SSH (22) from GitHub's runner IP ranges,
#     or from 0.0.0.0/0 relying on key-based auth — GitHub Actions runners
#     don't have static IPs.
# Secrets required under Settings → Environments → production:
#   DEPLOY_HOST      EC2 public IP or DNS name
#   DEPLOY_USER      SSH user for the AMI (e.g. `ec2-user` on AL2023, `ubuntu` on Ubuntu)
#   DEPLOY_SSH_KEY   private half of the EC2 key pair (PEM contents)
#   DEPLOY_APP_DIR   absolute path on the instance holding this repo (e.g. /opt/devpulse)
on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # manual "deploy main now" button in the Actions tab

concurrency:
  group: cd-main
  cancel-in-progress: false   # never cancel a deploy that's already in flight

permissions:
  contents: read
  packages: write   # required to push images to GHCR
  deployments: write # required to create GitHub deployment events

jobs:
  # ============================================================
  # Job 1: Full test suite — the release gate
  # ============================================================
  test:
    name: Test gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules and run tests
        run: mvn -B clean verify
        working-directory: backend
        env:
          JWT_SECRET: test-secret-key-min-32-chars-for-ci-testing-only
          POSTGRES_URL: jdbc:postgresql://localhost:5432/devpulse
          POSTGRES_USER: devpulse
          POSTGRES_PASSWORD: devpulse

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/analytics-service/requirements.txt

      - name: Install analytics dependencies
        run: pip install -r requirements.txt
        working-directory: backend/analytics-service

      - name: Run analytics tests (if any exist)
        run: |
          if find tests -name '*.py' -not -name '__init__.py' | grep -q .; then
            pip install pytest
            pytest tests/ -v
          else
            echo "No tests yet — skipping"
          fi
        working-directory: backend/analytics-service

  # ============================================================
  # Job 2: Build every service's image and push it to GHCR
  #
  # Database migrations are deliberately NOT part of this pipeline — they're
  # run by hand against Supabase, outside CI/CD. This workflow never reads
  # backend/database/ or touches Supabase.
  # ============================================================
  build-and-push:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: backend
            dockerfile: backend/api-gateway/Dockerfile
          - service: auth-service
            context: backend
            dockerfile: backend/auth-service/Dockerfile
          - service: integration-service
            context: backend
            dockerfile: backend/integration-service/Dockerfile
          - service: metrics-service
            context: backend
            dockerfile: backend/metrics-service/Dockerfile
          - service: notification-service
            context: backend
            dockerfile: backend/notification-service/Dockerfile
          - service: analytics-service
            context: backend/analytics-service
            dockerfile: backend/analytics-service/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GHCR requires a lowercase image path; the repo owner
      # (Devpulse-3J) is mixed-case, so it can't be used as-is.
      - name: Compute lowercase image name
        id: image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER_LC}/devpulse-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ============================================================
  # Job 3: Deploy to the EC2 instance over SSH
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # add the DEPLOY_* secrets here:
                               # Settings → Environments → production

    steps:
      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          environment: 'production'
          initial-status: 'in_progress'

      # The compose services use `build:` (no `image:`), so the instance builds
      # from its own checkout — `docker compose pull` would do nothing. Images
      # are built one service at a time to keep memory use down, then
      # `up --no-build` recreates only the containers whose image changed.
      # `.env` lives at the repo root on the instance (gitignored, created by
      # hand), so it is passed with --env-file; without it notification-service
      # gets no database settings. This step never touches Supabase or
      # backend/database/ — migrations are run by hand, separately.
      - name: Deploy over SSH to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 25m
          envs: DEPLOY_APP_DIR
          script: |
            set -e
            cd "$DEPLOY_APP_DIR"
            git pull --ff-only
            test -f .env || { echo "Missing $DEPLOY_APP_DIR/.env on the instance"; exit 1; }
            C="docker compose --env-file .env -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.supabase.yml"
            for s in analytics-service api-gateway auth-service integration-service metrics-service notification-service; do
              $C build "$s"
            done
            $C up -d --no-build
            docker image prune -f

            # Fail the run if the gateway never comes up healthy.
            for i in $(seq 1 36); do
              if curl -fsS -m 5 http://localhost:8080/actuator/health >/dev/null; then
                echo "Gateway healthy after $((i * 5))s"
                exit 0
              fi
              sleep 5
            done
            echo "Gateway not healthy after 180s"
            $C ps
            exit 1
        env:
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}

      - name: Update Deployment Status (Success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: 'success'
          environment-url: 'http://${{ secrets.DEPLOY_HOST }}'

      - name: Update Deployment Status (Failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: 'failure'
