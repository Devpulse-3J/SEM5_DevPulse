name: PR Checks

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize   # re-runs when new commits are pushed
      - reopened

# Cancel superseded runs for the same PR. head_ref is the source branch and is
# stable across pushes; github.ref for a PR is refs/pull/N/merge, which works
# but reads less clearly.
concurrency:
  group: pr-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  # ============================================================
  # Job 1: Build every Maven module and run the unit tests
  # ============================================================
  backend-build-test:
    name: Backend (Java services)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # No ./mvnw is committed in this repo, so we rely on the runner's Maven.
      - name: Show Maven version
        run: mvn --version
        working-directory: backend

      # `verify` covers compile + test + package for all six modules.
      # Every current test is a plain unit test, so no database, broker or
      # Testcontainers runtime is required here.
      - name: Build all modules and run tests
        run: mvn -B clean verify
        working-directory: backend
        env:
          # Dummy values so any @Value-annotated config resolves. The gateway
          # rejects a JWT secret under 32 characters at construction time.
          JWT_SECRET: test-secret-key-min-32-chars-for-ci-testing-only
          POSTGRES_URL: jdbc:postgresql://localhost:5432/devpulse
          POSTGRES_USER: devpulse
          POSTGRES_PASSWORD: devpulse

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
          retention-days: 7

  # ============================================================
  # Job 2: Every Dockerfile still builds
  #
  # This replaces the old "service startup check", which ran
  # `mvn package -DskipTests` and therefore started nothing — it only
  # re-compiled what Job 1 had already compiled, four times over.
  # Building the images is genuinely independent: it catches a broken
  # Dockerfile, a bad build context or a missing base image, none of
  # which `mvn verify` can see.
  # ============================================================
  docker-build:
    name: Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: backend-build-test

    strategy:
      fail-fast: false   # one broken image should not hide the others
      matrix:
        include:
          # Java services: the Dockerfiles COPY the whole reactor, so the
          # build context must be backend/ for the parent POM to resolve.
          - service: api-gateway
            context: backend
            dockerfile: backend/api-gateway/Dockerfile
          - service: auth-service
            context: backend
            dockerfile: backend/auth-service/Dockerfile
          - service: integration-service
            context: backend
            dockerfile: backend/integration-service/Dockerfile
          - service: metrics-service          # was missing from the old matrix
            context: backend
            dockerfile: backend/metrics-service/Dockerfile
          - service: notification-service
            context: backend
            dockerfile: backend/notification-service/Dockerfile
          # Python service builds from its own directory.
          - service: analytics-service
            context: backend/analytics-service
            dockerfile: backend/analytics-service/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false            # verification only, nothing is published
          load: false
          # Layer cache keyed per service, or every PR pays a full Maven
          # dependency download inside the image.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ============================================================
  # Job 3: Analytics service (Python)
  # ============================================================
  analytics-service:
    name: Analytics service (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/analytics-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend/analytics-service

      # compileall byte-compiles without importing, so it flags syntax errors
      # in the training scripts too even though their extra dependencies
      # (requests) are not in requirements.txt.
      - name: Verify all Python compiles
        run: python -m compileall -q app training
        working-directory: backend/analytics-service

      # A real import exercises FastAPI wiring, which compileall cannot.
      - name: Verify the FastAPI app imports
        run: python -c "from app.main import app; print('app imports OK')"
        working-directory: backend/analytics-service

      - name: Run tests (if any exist)
        run: |
          if find tests -name '*.py' -not -name '__init__.py' | grep -q .; then
            pip install pytest
            pytest tests/ -v
          else
            echo "No tests yet — skipping"
          fi
        working-directory: backend/analytics-service

  
  # ============================================================
  # Job 5: Single required status check for branch protection
  # ============================================================
  all-checks-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    if: always()   # must run even when a dependency failed, to report it
    needs:
      - backend-build-test
      - docker-build
      - analytics-service
    

    steps:
      # A matrix job aggregates to 'failure' if any leg fails, so these four
      # results cover every leg above.
      - name: Verify all previous jobs succeeded
        run: |
          echo "backend-build-test : ${{ needs.backend-build-test.result }}"
          echo "docker-build       : ${{ needs.docker-build.result }}"
          echo "analytics-service  : ${{ needs.analytics-service.result }}"
        
          if [ "${{ needs.backend-build-test.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ] || \
             [ "${{ needs.analytics-service.result }}" != "success" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All checks passed — safe to merge."
