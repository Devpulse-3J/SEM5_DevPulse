server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: notification-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/devpulse}
    username: ${POSTGRES_USER:devpulse}
    password: ${POSTGRES_PASSWORD:devpulse}
  jpa:
    hibernate:
      # Schema is owned by Flyway (backend/database); validate entities, never modify.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  rabbitmq:
    username: ${RABBITMQ_USER:devpulse}
    password: ${RABBITMQ_PASSWORD:devpulse}
    addresses: ${RABBITMQ_URL:amqp://devpulse:devpulse@localhost:5672}
management:
  endpoints:
    web:
      exposure:
        include: health,info

mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:jayasuriyaumaya@gmail.com}
    password: ${SMTP_PASSWORD:wdlpqmckejfxzeyl}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

