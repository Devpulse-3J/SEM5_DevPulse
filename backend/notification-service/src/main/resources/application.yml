server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: notification-service
  datasource:
    # Docker injects the Supabase values through POSTGRES_* variables.
    # No credentials belong in this source-controlled file.
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Schema is owned by Flyway (backend/database); validate entities, never modify.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  rabbitmq:
    username: ${RABBITMQ_USER:devpulse}
    password: ${RABBITMQ_PASSWORD:devpulse}
    addresses: ${RABBITMQ_URL:amqp://devpulse:devpulse@localhost:5672}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
