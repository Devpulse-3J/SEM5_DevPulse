server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: notification-service
  datasource:
    # Docker injects the Supabase values through POSTGRES_* variables.
    # No credentials belong in this source-controlled file.
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Schema is owned by Flyway (backend/database); validate entities, never modify.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  rabbitmq:
    username: ${RABBITMQ_USER:devpulse}
    password: ${RABBITMQ_PASSWORD:devpulse}
    addresses: ${RABBITMQ_URL:amqp://devpulse:devpulse@localhost:5672}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
devpulse:
  notification:
    slack:
      # SlackNotificationService / SlackOAuthController read these property
      # names. Without this block the SLACK_* variables reach the container but
      # nothing binds them, so every Slack send reports "not configured" and the
      # team-message endpoint answers 502 (zero delivered).
      webhook-url: ${SLACK_WEBHOOK_URL:}
      bot-token: ${SLACK_BOT_TOKEN:}
      client-id: ${SLACK_CLIENT_ID:}
      client-secret: ${SLACK_CLIENT_SECRET:}
      redirect-uri: ${SLACK_REDIRECT_URI:http://localhost:8084/api/slack/oauth/callback}
management:
  endpoints:
    web:
      exposure:
        include: health,info
