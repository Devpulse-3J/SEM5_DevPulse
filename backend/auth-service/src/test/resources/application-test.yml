# TEST-SCOPE ONLY — never packaged into the running service.
# Production still runs on Postgres with Flyway owning the schema; this file
# exists so @SpringBootTest can verify the application context wires up
# without requiring a live Postgres or RabbitMQ.

spring:
  datasource:
    # In-memory, PostgreSQL compatibility mode. Dropped when the JVM exits.
    url: jdbc:h2:mem:devpulse-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # 'none', not 'validate': the real schema is Flyway's, and we are not
      # recreating 17 tables here. Context-loading is what is under test.
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false
  rabbitmq:
    addresses: amqp://localhost:5672
    listener:
      simple:
        # Without this, @RabbitListener containers try to reach a broker at
        # startup and flood the test log with retry errors.
        auto-startup: false

# Placeholder for the property that has no default. Throwaway test value.
jwt:
  secret: test-only-secret-key-min-32-chars-long-not-a-real-secret
  expiration: 3600

management:
  health:
    # No broker in unit tests, so its health would always report DOWN.
    rabbit:
      enabled: false
