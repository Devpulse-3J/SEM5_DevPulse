server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: auth-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/devpulse}
    username: ${POSTGRES_USER:devpulse}
    password: ${POSTGRES_PASSWORD:devpulse}
  jpa:
    hibernate:
      # Schema is owned by Flyway (backend/database); validate entities, never modify.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://localhost:5672}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
jwt:
  secret: ${JWT_SECRET:devpulse-default-secret-key-change-me-in-production-min-32-chars!!}
  expiration: ${JWT_EXPIRATION:3600}
management:
  info:
    env:
      # Required for the info.* properties below to appear on /actuator/info.
      enabled: true
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

# Surfaced at GET /actuator/info.
info:
  app:
    name: auth-service
    description: Users, companies, projects, memberships, JWT issuing and per-project RBAC.
    version: '@project.version@'
