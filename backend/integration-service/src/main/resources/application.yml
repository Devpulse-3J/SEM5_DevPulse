server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: integration-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/devpulse}
    username: ${POSTGRES_USER:devpulse}
    password: ${POSTGRES_PASSWORD:devpulse}
  jpa:
    hibernate:
      # Schema is owned by Flyway (backend/database); validate entities, never modify.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  rabbitmq:
    username: ${RABBITMQ_USER:devpulse}
    password: ${RABBITMQ_PASSWORD:devpulse}
    addresses: ${RABBITMQ_URL:amqp://devpulse:devpulse@localhost:5672}

devpulse:
  rabbitmq:
    exchange: ${DEVPULSE_RABBITMQ_EXCHANGE:devpulse.events}
management:
  endpoints:
    web:
      exposure:
        include: health,info

github:
  webhook:
    # No default: a webhook secret that falls back to a known constant is not a
    # secret. The service must fail to start rather than validate signatures
    # against a value that is published in this file.
    secret: ${GITHUB_WEBHOOK_SECRET}
  app:
    # All GitHub App credentials come from the environment. They were previously
    # committed here as literal defaults; those values are compromised and must
    # be rotated in the GitHub App settings.
    id: ${GITHUB_APP_ID:}
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    private-key-path: ${GITHUB_PRIVATE_KEY_PATH:classpath:github-private-key.pem}
