server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: integration-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/devpulse}
    username: ${POSTGRES_USER:devpulse}
    password: ${POSTGRES_PASSWORD:devpulse}
  jpa:
    hibernate:
      # Schema is owned by Flyway (backend/database); validate entities, never modify.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  rabbitmq:
    username: ${RABBITMQ_USER:devpulse}
    password: ${RABBITMQ_PASSWORD:devpulse}
    addresses: ${RABBITMQ_URL:amqp://devpulse:devpulse@localhost:5672}

devpulse:
  rabbitmq:
    exchange: ${DEVPULSE_RABBITMQ_EXCHANGE:devpulse.events}
management:
  endpoints:
    web:
      exposure:
        include: health,info

github:
  api:
    # Key is camelCase to match GithubApiClient's @Value("${github.api.baseUrl}").
    # @Value does no relaxed binding, so `base-url` here would not resolve.
    baseUrl: ${GITHUB_API_BASE_URL:https://api.github.com}
    # Personal access token or GitHub App token. Empty means unauthenticated:
    # 60 requests/hour and private repositories return 404. The key was missing
    # entirely before, so GithubApiClient always fell back to no auth.
    token: ${GITHUB_API_TOKEN:}
  webhook:
    # No default: a webhook secret that falls back to a known constant is not a
    # secret. The service must fail to start rather than validate signatures
    # against a value that is published in this file.
    secret: ${GITHUB_WEBHOOK_SECRET}
  app:
    # The GitHub App that grants repository access. Only the App ID and private
    # key are needed (App JWT -> installation token). Deliberately NOT read from
    # GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET: those belong to auth-service's
    # separate OAuth App for sign-in, and sharing names is how they got mixed up.
    id: ${GITHUB_APP_ID:}
    # URL slug, e.g. github.com/apps/<slug>. Env var kept as GITHUB_APP_NAME.
    slug: ${GITHUB_APP_NAME:odineye-integrator-v2}
    # Base64 of the whole .pem file (single line), e.g. `base64 -w0 key.pem`.
    private-key-base64: ${GITHUB_APP_PRIVATE_KEY_BASE64:}
